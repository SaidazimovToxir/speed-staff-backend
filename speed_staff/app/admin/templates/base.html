<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Speed Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans">

    {% if admin_user %}
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col transition-all">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-2xl font-bold tracking-tight">Speed Staff</h1>
                <p class="text-sm text-gray-400 mt-1">Admin Portal</p>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/admin"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-chart-line w-6"></i> Dashboard
                </a>
                <a href="/admin/users"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-users w-6"></i> Users
                </a>
                <a href="/admin/vacancies"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-briefcase w-6"></i> Vacancies
                </a>
                <a href="/admin/applications"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-paper-plane w-6"></i> Applications
                </a>
                <a href="/admin/reviews"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-star w-6"></i> Reviews
                </a>
                <a href="/admin/reports"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-flag w-6"></i> Reports
                </a>
                <a href="/admin/documents"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-file-alt w-6"></i> Documents
                </a>
                <a href="/admin/skills"
                    class="flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <i class="fas fa-tools w-6"></i> Skills
                </a>
            </nav>

            <div class="p-4 border-t border-gray-800">
                <div class="flex items-center justify-between px-4 py-2 bg-gray-800 rounded-lg">
                    <div class="flex items-center">
                        <div
                            class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-sm font-bold">
                            A
                        </div>
                        <span class="ml-3 font-medium">{{ admin_user.username }}</span>
                    </div>
                    <a href="/admin/logout" class="text-gray-400 hover:text-red-400 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-semibold text-gray-800">{% block header %}Overview{% endblock %}</h2>

                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-500">v1.0.0</span>
                </div>
            </header>

            <!-- Page Content -->
            <div class="flex-1 overflow-auto p-8 bg-gray-50">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% else %}
    <!-- For isolated pages like login -->
    {% block standalone %}{% endblock %}
    {% endif %}

</body>

</html>
